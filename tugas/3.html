<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        jam = window.prompt("Jam Sekarang");
        alert(cekPesan(jam));

        function cekPesan(jam) {
            if (jam >= 6 && jam <= 10) {
                return "Selamat Pagi";
            } else if (jam >= 11 && jam <= 14) {
                return "Selamat Siang";
            } else if (jam >= 15 && jam <= 17) {
                return "Selamat Sore";
            } else if (jam >= 18 && jam <= 22) {
                return "Selamat Malam";
            } else if (jam >= 23 && jam <= 5) {
                return "Selamat Tidur";
            } else if (jam == 0) {
                return "Selamat Tidur";
            } else {
                return `Jam ${jam}? lu yakin?`;
            }
        }
    </script>
</body>

</html>
