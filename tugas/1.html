<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hello World</title>
</head>
<body>
    <script>
        Angka = window.prompt("nilai");
        alert(cekNilai(Angka));
        
        function cekNilai(Angka){
            if (Angka >= 85) {
                return "A";
            } else if (Angka >= 80) {
                return "A-";
            } else if (Angka >= 75) {
                return "B+";
            } else if (Angka >= 70) {
                return "B";
            } else if (Angka >= 65) {
                return "B-";
            } else if (Angka >= 60) {
                return "C+";
            } else if (Angka >= 55) {
                return "C";
            } else if (Angka >= 45) {
                return "D";
            } else {
                return "E";
            }
        }
    </script>
</body>
</html>
