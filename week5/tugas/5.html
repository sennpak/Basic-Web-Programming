<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        bilangan = window.prompt("Masukkan Angka yang Diinginkan");
        const list = [];
        let i = 1;
        while (i != bilangan) {
            if (i % 2 != 0) {
                list.push(i);
            }
            i++;
        }
        list.forEach(ganjil => {
            document.write(ganjil + " ");
        });
    </script>
</body>

</html>
